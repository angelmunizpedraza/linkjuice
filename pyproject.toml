[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkjuice"
version = "0.1.0"
description = "Internal link graph audit: orphans, click depth, internal PageRank and concrete link recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Muñiz Pedraza", email = "angelhd029@gmail.com" }]
keywords = ["seo", "internal-linking", "pagerank", "site-audit", "crawler", "technical-seo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/angelmunizpedraza/linkjuice"
Issues = "https://github.com/angelmunizpedraza/linkjuice/issues"

[project.scripts]
linkjuice = "linkjuice.cli:main"

[tool.setuptools.packages.find]
include = ["linkjuice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
