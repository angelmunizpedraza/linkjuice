name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          linkjuice run tests/fixtures/home.html tests/fixtures/boas.html tests/fixtures/eye.html tests/fixtures/endoscopy.html tests/fixtures/recovery.html tests/fixtures/privacy.html --files --min-source-words 100 --md /tmp/report.md
          test -s /tmp/report.md
